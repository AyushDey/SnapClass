name: Tests

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
      with:
        python-version: "3.13"

    - name: Install dependencies
      working-directory: backend
      run: uv sync --frozen --no-build --all-extras --dev

    - name: Run backend tests with coverage gate
      working-directory: backend
      run: uv run --frozen --no-build pytest -q tests --cov=. --cov-report=xml:coverage.xml --cov-fail-under=100

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
