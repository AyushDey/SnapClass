sonar.projectKey=AyushDey_SnapClass
sonar.organization=ayushdey

# Only analyze the backend Python code
sonar.sources=backend
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**

# Coverage report (path relative to repo root)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Exclude non-source files from analysis
sonar.exclusions=frontend/**,examples/**,postman/**,.postman/**,**/*.lock